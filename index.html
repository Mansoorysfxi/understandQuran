<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, responsive Quran study website with Arabic text in Uthmani and IndoPak scripts, word-by-word Urdu and English meanings, and complete translations.">
  <title>القرآن الكريم — Quran Study</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Gulzar&family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="top-nav" id="topNav">
    <div class="nav-container">
      <div class="nav-left">
        <a href="#/" class="brand-link" title="Home: Surah Index" aria-label="Surah Index">
          <span class="brand-icon">📖</span>
          <span class="brand-title">Quran Study</span>
        </a>
      </div>

      <!-- Reader Title & Progress (visible only in reader view) -->
      <div class="nav-center" id="navReaderInfo" style="display: none;">
        <div class="nav-surah-title" id="navSurahTitle">Surah Name</div>
        <div class="nav-surah-progress-track">
          <div class="nav-surah-progress-bar" id="navProgressBar" style="width: 0%;"></div>
        </div>
      </div>

      <div class="nav-right">
        <button id="searchBtn" class="nav-icon-btn" aria-label="Search Surahs" title="Search (Press /)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>

        <button id="themeToggleBtn" class="nav-icon-btn" aria-label="Toggle Theme" title="Switch Theme">
          <span class="theme-icon-light">☀️</span>
          <span class="theme-icon-sepia">📜</span>
          <span class="theme-icon-dark">🌙</span>
        </button>

        <button id="settingsBtn" class="nav-icon-btn" aria-label="Reader Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>

        <a href="#/about" class="nav-link" title="About & Attribution">About</a>
      </div>
    </div>
  </header>

  <!-- Main View Router Container -->
  <main id="app" class="main-content" role="main">
    <!-- Router dynamically injects views here -->
  </main>

  <!-- Quick Search Modal -->
  <div class="modal-backdrop" id="searchModal" style="display: none;" aria-hidden="true">
    <div class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="searchModalTitle">
      <div class="search-header">
        <h2 id="searchModalTitle" class="visually-hidden">Search Surahs</h2>
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="modalSearchInput" placeholder="Type surah number or name (e.g., 2, Baqarah, يس)..." autocomplete="off" autofocus>
          <button id="closeSearchBtn" class="icon-close-btn" aria-label="Close search">&times;</button>
        </div>
      </div>
      <div class="search-results-list" id="modalSearchResults">
        <!-- Filtered results render here -->
      </div>
    </div>
  </div>

  <!-- Settings Bottom Sheet / Modal -->
  <div class="modal-backdrop" id="settingsModal" style="display: none;" aria-hidden="true">
    <div class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">Reading Settings</h2>
        <button id="closeSettingsBtn" class="icon-close-btn" aria-label="Close settings">&times;</button>
      </div>

      <div class="settings-body">
        <!-- Appearance / Theme -->
        <section class="settings-section">
          <h3>Theme</h3>
          <div class="theme-options-grid">
            <button class="theme-btn" data-set-theme="light">
              <span class="theme-swatch light-swatch"></span>
              <span>Light</span>
            </button>
            <button class="theme-btn" data-set-theme="sepia">
              <span class="theme-swatch sepia-swatch"></span>
              <span>Sepia</span>
            </button>
            <button class="theme-btn" data-set-theme="dark">
              <span class="theme-swatch dark-swatch"></span>
              <span>Dark</span>
            </button>
          </div>
        </section>

        <!-- Arabic Script Selection -->
        <section class="settings-section">
          <h3>Arabic Script</h3>
          <div class="segmented-control">
            <button class="segment-btn active" data-script="uthmani">Uthmani (Madinah)</button>
            <button class="segment-btn" data-script="indopak">IndoPak (Subcontinent)</button>
          </div>
        </section>

        <!-- Content Display Toggles -->
        <section class="settings-section">
          <h3>Display Layers</h3>
          <div class="toggle-list">
            <label class="toggle-item">
              <span class="toggle-label">
                <strong>Word-by-word Urdu</strong>
                <small>لفظی ترجمہ under each word</small>
              </span>
              <input type="checkbox" id="toggleWbwUr" class="toggle-checkbox" checked>
              <span class="toggle-switch"></span>
            </label>

            <label class="toggle-item">
              <span class="toggle-label">
                <strong>Word-by-word English</strong>
                <small>English meaning under each word</small>
              </span>
              <input type="checkbox" id="toggleWbwEn" class="toggle-checkbox" checked>
              <span class="toggle-switch"></span>
            </label>

            <label class="toggle-item">
              <span class="toggle-label">
                <strong>Full Urdu Translation</strong>
                <small>Complete verse translation</small>
              </span>
              <input type="checkbox" id="toggleFullUr" class="toggle-checkbox" checked>
              <span class="toggle-switch"></span>
            </label>

            <div class="sub-setting" id="urTranslatorSection">
              <label for="urTranslatorSelect">Urdu Translator:</label>
              <select id="urTranslatorSelect" class="form-select">
                <option value="both">Both (Maududi + Jalandhari)</option>
                <option value="97" selected>Maududi (Tafheem-ul-Quran)</option>
                <option value="234">Fatah Muhammad Jalandhari</option>
              </select>
            </div>

            <label class="toggle-item">
              <span class="toggle-label">
                <strong>Full English Translation</strong>
                <small>Sahih International</small>
              </span>
              <input type="checkbox" id="toggleFullEn" class="toggle-checkbox" checked>
              <span class="toggle-switch"></span>
            </label>
          </div>
        </section>

        <!-- Font Sizes -->
        <section class="settings-section">
          <h3>Font Sizes</h3>
          <div class="slider-group">
            <div class="slider-header">
              <span>Arabic</span>
              <span id="arabicSizeVal" class="slider-val">32px</span>
            </div>
            <input type="range" id="arabicSizeSlider" min="22" max="48" step="2" value="32" class="range-slider">
          </div>

          <div class="slider-group">
            <div class="slider-header">
              <span>Urdu</span>
              <span id="urduSizeVal" class="slider-val">22px</span>
            </div>
            <input type="range" id="urduSizeSlider" min="16" max="32" step="1" value="22" class="range-slider">
          </div>

          <div class="slider-group">
            <div class="slider-header">
              <span>English / Translation</span>
              <span id="englishSizeVal" class="slider-val">16px</span>
            </div>
            <input type="range" id="englishSizeSlider" min="13" max="24" step="1" value="16" class="range-slider">
          </div>
        </section>

        <!-- Reader Navigation & Jump -->
        <section class="settings-section" id="jumpSection">
          <h3>Jump to Ayah</h3>
          <div class="jump-row">
            <input type="number" id="jumpAyahInput" min="1" placeholder="Ayah #" class="jump-input">
            <button id="jumpAyahBtn" class="btn btn-primary">Go</button>
          </div>
        </section>
      </div>

      <div class="settings-footer">
        <button id="resetSettingsBtn" class="btn btn-secondary">Reset to Defaults</button>
        <button id="applySettingsBtn" class="btn btn-primary">Done</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Application JS Entry -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
